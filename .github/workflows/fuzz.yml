name: Fuzzing

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration per target (seconds)'
        required: false
        default: '300'

env:
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++-11-dev build-essential

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      # BUILD EVERY TARGET FIRST, AND FAIL HARD IF ONE DOES NOT COMPILE.
      #
      # This lane reported success every day while running two of its three
      # targets: fuzz_handler_dispatch had failed to BUILD since
      # HandlerRegistry::get was removed, and `continue-on-error: true` on the
      # run steps turned that into a green tick (paiml/pforge#11). The
      # downstream "Check for crashes" step then found no crash artifacts —
      # because the fuzzer never started — and absence of evidence was read as
      # evidence of absence.
      #
      # continue-on-error is defensible for a FINDING: a crash should upload
      # artifacts rather than wedge the lane. It is never right for a target
      # that does not compile. That is a broken lane, not a result.
      - name: Build all fuzz targets (a target that cannot build is a broken lane)
        run: |
          set -euo pipefail
          targets=$(ls fuzz/fuzz_targets/*.rs | xargs -n1 basename | sed 's/\.rs$//')
          echo "targets: $targets"
          for t in $targets; do
            echo "::group::build $t"
            cargo +nightly fuzz build "$t"
            echo "::endgroup::"
          done
          echo "$targets" > /tmp/fuzz-targets.txt

      - name: Run fuzz_config_parser
        run: |
          cargo +nightly fuzz run fuzz_config_parser -- \
            -max_total_time=${{ github.event.inputs.duration || '300' }} \
            -runs=100000 \
            -print_final_stats=1
        continue-on-error: true
        id: fuzz_config

      - name: Run fuzz_handler_dispatch
        run: |
          cargo +nightly fuzz run fuzz_handler_dispatch -- \
            -max_total_time=${{ github.event.inputs.duration || '300' }} \
            -runs=100000 \
            -print_final_stats=1
        continue-on-error: true
        id: fuzz_handler

      - name: Run fuzz_validation
        run: |
          cargo +nightly fuzz run fuzz_validation -- \
            -max_total_time=${{ github.event.inputs.duration || '300' }} \
            -runs=100000 \
            -print_final_stats=1
        continue-on-error: true
        id: fuzz_validation

      # A run step that was skipped or died instantly still leaves outcome
      # 'failure' rather than silence, so assert on the outcomes explicitly:
      # a lane where every target failed for a non-crash reason is not a lane
      # that found three bugs, it is a lane that did not run.
      - name: Every fuzz target must have executed
        run: |
          set -euo pipefail
          declare -A o=(
            [fuzz_config_parser]="${{ steps.fuzz_config.outcome }}"
            [fuzz_handler_dispatch]="${{ steps.fuzz_handler.outcome }}"
            [fuzz_validation]="${{ steps.fuzz_validation.outcome }}"
          )
          missing=0
          for t in "${!o[@]}"; do
            echo "$t: ${o[$t]}"
            if [ "${o[$t]}" = "skipped" ] || [ -z "${o[$t]}" ]; then
              echo "::error::$t did not run"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 90

      - name: Check for crashes
        run: |
          crash_files=$(find fuzz/artifacts -type f 2>/dev/null | head -1)
          if [ -n "$crash_files" ]; then
            echo "❌ Fuzzing found crashes!"
            find fuzz/artifacts -type f
            exit 1
          else
            echo "✅ No crashes found"
          fi

      - name: Save corpus
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ github.sha }}
          path: fuzz/corpus/
          retention-days: 30
