# Sovereign CI — calls reusable workflow from paiml/.github
# Change once in paiml/.github → applies to all repos
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@main
    with:
      repo: ${{ github.event.repository.name }}
    secrets: inherit

  # The org ruleset "Green Main — unified gate enforcement" requires a status
  # check named exactly `gate`. A reusable workflow's jobs always report with
  # the caller's job name prefixed — `ci / gate`, `ci / test` — so nothing this
  # repo produced could ever satisfy it, and every pull request sat at
  # "the base branch policy prohibits the merge" with all checks green.
  #
  # This is the same unprefixed top-level job pmat carries for the same reason.
  gate:
    runs-on: ubuntu-latest
    needs: [ci, feature-matrix]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "ci failed: ${{ needs.ci.result }}"
            exit 1
          fi
          if [ "${{ needs.feature-matrix.result }}" != "success" ]; then
            echo "feature-matrix failed: ${{ needs.feature-matrix.result }}"
            exit 1
          fi
          echo "ci passed"

  # pforge declares sse, websocket, http-handlers and persistence optional, but
  # until 2026-08-20 nothing ever BUILT a configuration other than the default,
  # so all four were optional in name only: `--no-default-features` did not
  # compile at all (paiml/pforge#10). The defect was invisible for the crate's
  # whole life because the only configuration anyone exercised was the one where
  # everything is on.
  #
  # A feature matrix that is never run drifts back immediately, so this job is
  # the guard, not the one-time fix.
  feature-matrix:
    # The fleet, not ubuntu-latest: .cargo/config.toml pins an ABSOLUTE
    # target-dir (/mnt/zram/targets/pforge) that only exists on fleet machines,
    # so a GitHub-hosted cargo job in this repo dies with
    # "failed to create directory `/mnt/zram/targets`: Permission denied".
    runs-on: [self-hosted, clean-room]
    strategy:
      fail-fast: false
      # Seven legs at once each hold a runner slot on a SHARED 16-runner fleet
      # and each compiles pforge-runtime from scratch. Measured 2026-08-20 while
      # this matrix ran: intel went to load 123 on 32 cores with 18 runner
      # workers, and every other repo's jobs queued behind it. fail-fast stays
      # off — the whole point is knowing WHICH configuration broke — so the cap
      # bounds the burst instead.
      max-parallel: 3
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--all-features"
          # Each optional feature alone, so a missing cfg on ONE of them cannot
          # hide behind a sibling that happens to pull in the same import.
          - "--no-default-features --features sse"
          - "--no-default-features --features websocket"
          - "--no-default-features --features http-handlers"
          - "--no-default-features --features persistence"
    steps:
      - uses: actions/checkout@v5

      # That absolute target-dir is SHARED by every job on the machine, and
      # seven matrix legs writing one target dir race each other. Give each leg
      # its own under the per-job temp.
      #
      # Set here rather than in job-level `env:` because the `runner` context is
      # not available there — using it silently makes the whole workflow file
      # invalid, which GitHub reports as a run with zero jobs and no log rather
      # than as a syntax error.
      - name: Isolate this leg's target dir
        # Keyed by RUN and by LEG, not just by runner.
        #
        # The first version used ${RUNNER_TEMP}/feature-matrix. RUNNER_TEMP is
        # per-RUNNER, not per-run, and GitHub wipes it between jobs — so with
        # cancel-in-progress on this workflow, a superseded run's post-job
        # cleanup deletes the directory while the NEW run is mid-compile on that
        # same runner. Observed 2026-08-21 on runner-10:
        #
        #   error: could not parse/generate dep info at:
        #     .../_work/_temp/feature-matrix/debug/deps/futures_io-….d
        #   Caused by: No such file or directory (os error 2)
        #
        # Same shape as aprender#1693, where per-PR target dirs collided under
        # rapid pushes and had to be deepened to per-run. github.run_id makes it
        # unique per run; job-index separates the concurrent legs.
        run: |
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/fm-${{ github.run_id }}-${{ strategy.job-index }}" >> "$GITHUB_ENV"

      # RUNNER_TEMP is cleaned between jobs, but a cancelled run can leave one
      # behind. Reclaim anything older than a day so this cannot accrete on a
      # long-lived self-hosted runner.
      - name: Reap stale feature-matrix target dirs
        run: find "${RUNNER_TEMP}" -maxdepth 1 -name 'fm-*' -type d -mtime +1 -exec rm -rf {} + 2>/dev/null || true

      # No toolchain action here on purpose: fleet runners share one $HOME, and
      # installing toolchains into a shared ~/.cargo/bin has taken the fleet out
      # three times. The runners already carry stable + clippy.

      # `-p pforge-runtime`, NOT `--workspace`. This is the whole correctness of
      # this job, and the first draft of it got this wrong.
      #
      # Cargo unifies features across a workspace build: pforge-cli depends on
      # pforge-runtime with default features, so `cargo check --workspace
      # --no-default-features` turns sse/websocket/http-handlers straight back
      # ON. Verified by reintroducing the paiml/pforge#10 bug and running both:
      # the --workspace form PASSED with the bug present, the -p form failed.
      #
      # So a workspace-level feature matrix is not a weaker guard here — it is
      # a green check that cannot fail for the reason it exists.
      - name: clippy ${{ matrix.features }}
        run: cargo clippy -p pforge-runtime --all-targets ${{ matrix.features }} -- -D warnings
      - name: test ${{ matrix.features }}
        run: cargo test -p pforge-runtime ${{ matrix.features }}

      # Probe the instrument: the minimal build must actually EXCLUDE the
      # optional modules. If a future refactor makes http unconditional again,
      # the steps above would still pass while silently protecting nothing.
      - name: minimal build must not contain the optional handlers
        if: matrix.features == '--no-default-features'
        run: |
          if cargo tree -p pforge-runtime --no-default-features -e normal 2>/dev/null | grep -q reqwest; then
            echo "::error::reqwest is present in the minimal build — http-handlers is not really optional"
            exit 1
          fi
          echo "minimal build excludes reqwest, as http-handlers being optional requires"
