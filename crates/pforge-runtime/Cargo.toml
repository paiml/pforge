[package]
name = "pforge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

[features]
default = ["sse", "websocket", "http-handlers"]
# Transport features
sse = ["pmcp/sse"]
websocket = ["pmcp/websocket"]
# Handler features
http-handlers = ["dep:reqwest"]
# aprender-db KV persistence (Phase 6; trueno-db was consolidated into aprender, APR-MONO)
persistence = ["dep:aprender-db"]
# Full feature set
full = ["sse", "websocket", "http-handlers", "persistence"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
pforge-config = { workspace = true }

# Runtime-specific dependencies
pmcp = { version = "2.18", default-features = false }
schemars = { version = "0.8", features = ["derive"] }
rustc-hash = "2.1"
dashmap = "6.2"
reqwest = { version = "0.13", features = ["json", "query"], optional = true }
# aprender-db for KV persistence (Phase 6; trueno-db is no longer published standalone)
aprender-db = { workspace = true, optional = true }
regex = "1.13"
rand = "0.10"

[dev-dependencies]
tempfile = "3.27"
proptest = "1.11"
criterion = { version = "0.8", features = ["async_tokio"] }
mockito = "1.7"

[[bench]]
name = "dispatch_benchmark"
harness = false

[[bench]]
name = "throughput_benchmark"
harness = false

[lints]
workspace = true
