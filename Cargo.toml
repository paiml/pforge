[workspace]
resolver = "2"
members = [
    "crates/pforge-cli",
    "crates/pforge-runtime",
    "crates/pforge-codegen",
    "crates/pforge-config",
    "crates/pforge-macro",
    "crates/pforge-bridge",
    "crates/pforge-integration-tests",
    "examples/calculator",
    "examples/telemetry-server",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/paiml/pforge"
authors = ["Pragmatic AI Labs"]
description = "Zero-boilerplate MCP server framework with EXTREME TDD methodology"
keywords = ["mcp", "codegen", "tdd", "framework", "declarative"]
categories = ["development-tools", "web-programming", "command-line-utilities"]
homepage = "https://github.com/paiml/pforge"
documentation = "https://docs.rs/pforge-runtime"

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.53", features = ["full", "test-util"] }
async-trait = "0.1"

# Testing dependencies
proptest = "1.11"
tempfile = "3.27"

# External crates (PAIML ecosystem)
aprender-db = { version = "0.63", default-features = false }

# Internal crates
pforge-runtime = { path = "crates/pforge-runtime", version = "0.2" }
pforge-config = { path = "crates/pforge-config", version = "0.2" }
pforge-codegen = { path = "crates/pforge-codegen", version = "0.2" }
pforge-macro = { path = "crates/pforge-macro", version = "0.2" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "allow"
# TODO: Re-enable missing_docs after documentation sprint
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
# Allow these for now - TODO: Fix in quality sprint
format_push_string = "allow"
uninlined_format_args = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
unused_self = "allow"
use_self = "allow"
return_self_not_must_use = "allow"
cast_precision_loss = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
inline_always = "allow"
derive_partial_eq_without_eq = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
significant_drop_in_scrutinee = "allow"
float_cmp = "allow"
only_used_in_recursion = "allow"
doc_link_with_quotes = "allow"
future_not_send = "allow"
default_constructed_unit_structs = "allow"
default_trait_access = "allow"
manual_let_else = "allow"
ptr_cast_constness = "allow"
ptr_as_ptr = "allow"
bool_to_int_with_if = "allow"
or_fun_call = "allow"
needless_raw_string_hashes = "allow"
explicit_iter_loop = "allow"
redundant_clone = "allow"
# Enforce safety (warn only, not deny)
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

[workspace.metadata.pmat]
quality-gates = ".pmat/quality-gates.yaml"
metrics = ".pmat-metrics.toml"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
